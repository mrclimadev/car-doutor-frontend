<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="#0c1f0c"/>

  <!-- Leaf body: teardrop apontando para cima, centralizado -->
  <path d="M16 4
    C16 4 26 9.5 26 19
    C26 24.7 21.5 29 16 29
    C10.5 29 6 24.7 6 19
    C6 9.5 16 4 16 4Z"
    fill="#4ecb71"/>

  <!-- Brilho sutil no canto superior esquerdo da folha -->
  <path d="M11.5 8.5 C8.5 12 7 16 7.5 20"
    stroke="#8eeaaa" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.45"/>

  <!-- Nervura central -->
  <path d="M16 7 L16 27"
    stroke="#0c1f0c" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

  <!-- Nervuras laterais -->
  <path d="M16 14 Q12 16 10 19"
    stroke="#0c1f0c" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.28"/>
  <path d="M16 19.5 Q12 21.5 10.5 24"
    stroke="#0c1f0c" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.28"/>

  <!-- Caule pequeno na base -->
  <line x1="16" y1="29" x2="16" y2="31"
    stroke="#4ecb71" stroke-width="2" stroke-linecap="round"/>
</svg>